# Nginx Server Block for VejaraFacility.com (VPS: 72.61.232.252)
# Deploy to: /etc/nginx/sites-available/vejarafacility.conf
# Link to:   /etc/nginx/sites-enabled/vejarafacility.conf

# Upstream Next.js Standalone / Docker server on port 3005
upstream vejarafacility_upstream {
    server 127.0.0.1:3005;
    keepalive 64;
}

# 1. HTTP Server Block (Listens on IP and Domain)
server {
    listen 80;
    listen [::]:80;
    server_name 72.61.232.252 vejarafacility.com www.vejarafacility.com;

    # Maximum file upload size for resumes & quote attachments
    client_max_body_size 20M;

    # Gzip compression for performance
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # Access and Error Logs
    access_log /var/log/nginx/vejarafacility_access.log;
    error_log /var/log/nginx/vejarafacility_error.log warn;

    # Static file caching for Next.js static assets
    location /_next/static/ {
        proxy_pass http://vejarafacility_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /public/ {
        proxy_pass http://vejarafacility_upstream;
        expires 30d;
        access_log off;
    }

    # Main application proxy
    location / {
        proxy_pass http://vejarafacility_upstream;
        proxy_http_version 1.1;
        
        # Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Client IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

